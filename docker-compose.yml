services:
  web:
    build: .
    volumes:
      - .:/var/www/pokedex/
      # Vault do SDD (GDD.md e sessions/ sao symlinks para ../vaults/...);
      # sem este mount os symlinks ficam quebrados dentro do container e os
      # testes que leem GDD/sessions (hygiene C6) ficam inertes.
      - ../vaults:/var/www/vaults
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgres://pokedex:pokedex@db:5432/pokedex"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pokedex
      POSTGRES_PASSWORD: pokedex
      POSTGRES_DB: pokedex
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokedex -d pokedex"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:
