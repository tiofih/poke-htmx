# frozen_string_literal: true

AllCops:
  SuggestExtensions: false
  NewCops: enable
  TargetRubyVersion: 3.3
  Exclude:
    - "gems/**/*"
    - "cache/**/*"
    - "specifications/**/*"
    - "bin/**/*"

Layout/LineLength:
  Max: 120

Metrics/ModuleLength:
  Max: 120

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/OneClassPerFile:
  Enabled: false

# Naming/PredicateMethod (RuboCop 1.76+, habilitado via NewCops) exige sufixo ? para
# métodos com TODOS os retornos booleanos. `evolve`/`learn_move` são nomes de contrato
# fixados nos critérios da sessão 0024 (D2-B) — permitidos aqui em vez de rubocop:disable.
Naming/PredicateMethod:
  AllowedPatterns:
    - '\A(evolve|learn_move)\z'
