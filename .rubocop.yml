# frozen_string_literal: true

AllCops:
  SuggestExtensions: false
  NewCops: enable
  TargetRubyVersion: 3.3
  Exclude:
    - "gems/**/*"
    - "cache/**/*"
    - "specifications/**/*"
    - "bin/**/*"

Layout/LineLength:
  Max: 120

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/OneClassPerFile:
  Enabled: false
