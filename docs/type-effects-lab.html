<title>Type Effects Lab — Fire</title>
<style>
#stage{position:relative;width:240px;height:120px;margin:24px auto;border-radius:16px;background:#1f2937;overflow:hidden}
.stage{position:relative;width:240px;height:120px;margin:24px auto;border-radius:16px;background:#1f2937;overflow:hidden}
.shot{position:absolute;left:8px;top:50%;width:12px;height:12px;animation:travel 0.4s linear infinite}
@keyframes travel{0%{transform:translateX(0)}100%{transform:translateX(200px)}}
.shot.diag{animation:travel-diag 0.4s linear infinite}
@keyframes travel-diag{0%{transform:translate(0,0)}100%{transform:translate(200px,80px)}}
.head{position:absolute;left:0;top:-6px;width:12px;height:12px;border-radius:50%}
.tail{position:absolute;border-radius:50%;opacity:0;animation:emit 0.4s linear infinite}
@keyframes emit{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(.3)}}
.p{position:absolute;left:8px;width:10px;height:10px;border-radius:50%;opacity:0;animation:drift 0.4s linear infinite}
@keyframes drift{0%{transform:translateX(0) scale(1);opacity:1}100%{transform:translateX(200px) scale(.4);opacity:0}}
.p:nth-child(1){top:10%;background:#ef4444;animation-delay:0s}
.p:nth-child(2){top:25%;background:#f97316;animation-delay:.0325s}
.p:nth-child(3){top:40%;background:#facc15;animation-delay:.065s}
.p:nth-child(4){top:55%;background:#ef4444;animation-delay:.0975s}
.p:nth-child(5){top:70%;background:#f97316;animation-delay:.13s}
.p:nth-child(6){top:85%;background:#facc15;animation-delay:.1625s}
.p:nth-child(7){top:20%;background:#f97316;animation-delay:.195s}
.p:nth-child(8){top:35%;background:#ef4444;animation-delay:.2275s}
.p:nth-child(9){top:50%;background:#facc15;animation-delay:.26s}
.p:nth-child(10){top:65%;background:#ef4444;animation-delay:.2925s}
.p:nth-child(11){top:80%;background:#f97316;animation-delay:.325s}
.p:nth-child(12){top:45%;background:#facc15;animation-delay:.3575s}
.btns{display:flex;gap:8px;justify-content:center}
.todo{text-align:center;font-family:system-ui}
</style>
